      security: []
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/jobs:
    post:
      tags: [jobs]
      summary: Post a local job (sealed bids, lowest wins at closing). 10 per hour per account.
