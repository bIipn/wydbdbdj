      tags: [admin]
      summary: Run a scan now (x-admin-token).
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - { name: group, in: query, schema: { type: string, enum: [default, west, east, south, opengov-1, opengov-2, opengov-3, opengov-4, opengov-5] }, example: default }
        - { name: quiet, in: query, schema: { type: string, enum: ['0', '1', 'true', 'false'] }, example: '1' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                quiet: { type: boolean }
            example: { quiet: true }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '400': { $ref: '#/components/responses/Bad' }
        '401': { $ref: '#/components/responses/SignIn' }
        '501': { $ref: '#/components/responses/Json' }
  /api/admin/market/watch:
    get:
      tags: [admin]
      summary: The market watcher's status (x-admin-token).
      security:
        - adminToken: []
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '401': { $ref: '#/components/responses/SignIn' }
  /api/admin/market/refresh:
    post:
      tags: [admin]
      summary: Pull fresh market data now (x-admin-token).
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                states: { type: array, maxItems: 60, items: { type: string } }
                naics: { type: array, maxItems: 10, items: { type: string, pattern: '^\d{6}$' } }
                months: { type: integer, minimum: 1, maximum: 120 }
                details: { type: integer, minimum: 0, maximum: 200 }
                awards: { type: boolean }
                bls: { type: boolean }
            example: { states: [NV], naics: ['238210'], months: 12, awards: true, bls: false }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '400': { $ref: '#/components/responses/Bad' }
        '401': { $ref: '#/components/responses/SignIn' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/jobs/reports:
    get:
      tags: [admin]
      summary: >-
        Reports (x-admin-token): reports (jobs), conversationReports (each with the thread's messages) and profileReports
        (each with the card's text, even when hidden, and whether it is hidden).
      security:
        - adminToken: []
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '401': { $ref: '#/components/responses/SignIn' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/jobs/{id}/remove:
    post:
      tags: [admin]
      summary: Take a job down (x-admin-token).
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '401': { $ref: '#/components/responses/SignIn' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/jobs/fees/{feeId}/waive:
    post:
      tags: [admin]
      summary: Waive a recorded fee (x-admin-token).
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - name: feeId
          in: path
          required: true
          schema: { type: string, pattern: '^\d{1,15}$' }
          example: '1'
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '401': { $ref: '#/components/responses/SignIn' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/jobs/messages/{messageId}/remove:
    post:
      tags: [admin]
      summary: >-
        Remove one message (x-admin-token). The row stays; both sides see "Message removed by BidSwipe"; its text leaves
        every answer and its bell alert. The job's stage, made-contact, fees and read marks do not move.
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - name: messageId
          in: path
          required: true
          schema: { type: string, pattern: '^\d{1,15}$' }
          example: '1'
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '401': { $ref: '#/components/responses/SignIn' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/people/{id}/hide:
    post:
      tags: [admin]
      summary: >-
        Hide a person's card (x-admin-token): others see only the name, member since and job record, and "Profile hidden
        by BidSwipe". The owner still sees and edits their text.
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: 00000000-0000-4000-8000-000000000002
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '401': { $ref: '#/components/responses/SignIn' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/people/{id}/unhide:
    post:
      tags: [admin]
      summary: Show a hidden card again (x-admin-token).
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: 00000000-0000-4000-8000-000000000002
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '401': { $ref: '#/components/responses/SignIn' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/reports/{reportId}/resolve:
    post:
      tags: [admin]
      summary: Close a conversation or profile report (x-admin-token). It stays listed, with resolvedAt.
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - name: reportId
          in: path
          required: true
          schema: { type: string, pattern: '^\d{1,15}$' }
          example: '1'
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '401': { $ref: '#/components/responses/SignIn' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/cron/scan:
    get:
      tags: [cron]
      summary: The host scheduler's scan call (Bearer CRON_SECRET; 404 when CRON_SECRET is not set).
      security:
        - cronSecret: []
      parameters:
        - { name: group, in: query, schema: { type: string, enum: [default, west, east, south, opengov-1, opengov-2, opengov-3, opengov-4, opengov-5] }, example: default }
        - { name: quiet, in: query, schema: { type: string, enum: ['0', '1', 'true', 'false'] }, example: '1' }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '400': { $ref: '#/components/responses/Bad' }
        '401': { $ref: '#/components/responses/SignIn' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/cron/market:
    get:
      tags: [cron]
      summary: The host scheduler's market refresh call (Bearer CRON_SECRET).
      security:
        - cronSecret: []
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '401': { $ref: '#/components/responses/SignIn' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/cron/tick:
    get:
      tags: [cron]
      summary: Deadline reminders and waiting pushes (Bearer CRON_SECRET).
      security:
        - cronSecret: []
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '401': { $ref: '#/components/responses/SignIn' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: bs_session
      description: Set by POST /api/auth/login or /api/auth/signup (HttpOnly, 30 days, renewed while in use).
    adminToken:
      type: apiKey
      in: header
      name: x-admin-token
    cronSecret:
      type: http
      scheme: bearer
  parameters:
    Csrf:
      name: x-bidswipe
      in: header
      required: true
      description: CSRF guard (src/auth/guard.ts). Without it a signed-in state-changing request answers 403 csrf.
      schema: { type: string, enum: ['1'] }
      example: '1'
    JobId:
      name: id
      in: path
      required: true
      description: A local job id (uuid). The scan replaces the example with the seeded jobs (customVariables).
      schema: { type: string, format: uuid }
      example: 00000000-0000-4000-8000-000000000001
    BidIdPath:
      name: id
      in: path
      required: true
      description: 'A bid id: <source>:<id on the board>, or local:<job id>.'
      schema: { type: string, maxLength: 200 }
      example: 'questcdn:1903611:10385980'
    BidIdQuery:
      name: bidId
      in: query
      schema: { type: string, maxLength: 200 }
      example: 'questcdn:1903611:10385980'
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
        name: { type: string, maxLength: 80 }
    Answers:
      type: object
      required: [trades, zip, radiusMi]
      properties:
        intent: { type: string, enum: [work, hire, both] }
        businessName: { type: string, maxLength: 120 }
        trades: { type: array, items: { type: string } }
        zip: { type: string, pattern: '^\d{5}$' }
        radiusMi: { type: integer, minimum: 1 }
        valueRange:
          type: object
          properties:
            min: { type: integer, minimum: 0 }
            max: { type: integer, minimum: 0 }
        showSubWork: { type: boolean }
    NewJob:
      type: object
      required: [title, description, trades, zip, budgetMaxCents, closesInDays]
      properties:
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 4000 }
        trades: { type: array, items: { type: string } }
        zip: { type: string, pattern: '^\d{5}$' }
        address: { type: string, maxLength: 200 }
        phone: { type: string, maxLength: 40 }
        budgetMaxCents: { type: integer, minimum: 2000, maximum: 25000000 }
        closesInDays: { type: integer, minimum: 1, maximum: 30 }
    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
  responses:
    Json:
      description: JSON answer
      content: { application/json: { schema: { type: object } } }
    Bad:
      description: invalid input (the message says what to fix)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    SignIn:
      description: sign_in_required (or a missing admin token / cron secret)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Premium:
      description: premium_required (part of BidSwipe Pro)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Csrf:
      description: csrf (the x-bidswipe header is missing)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: not_allowed / not_available / csrf
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: not_found (also every accounts-only route in single mode)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: closed / onboarding_required / single_profile_mode
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooMany:
      description: too_many_attempts (rate limit; Retry-After says when)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
