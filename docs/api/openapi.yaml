      responses:
        '200': { $ref: '#/components/responses/Json' }
        '400': { $ref: '#/components/responses/Bad' }
        '401': { $ref: '#/components/responses/SignIn' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooMany' }
  /api/jobs/rules:
    get:
      tags: [jobs]
