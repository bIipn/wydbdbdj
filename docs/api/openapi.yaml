                awards: { type: boolean }
                bls: { type: boolean }
            example: { states: [NV], naics: ['238210'], months: 12, awards: true, bls: false }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '400': { $ref: '#/components/responses/Bad' }
        '401': { $ref: '#/components/responses/SignIn' }
