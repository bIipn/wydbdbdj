# HawkScan (StackHawk DAST) configuration for BidSwipe. Run by .github/workflows/hawkscan.yml against a server
# started from dist/ in accounts mode on a throwaway database; see docs/SECURITY-SCAN.md.
# Keys follow the CLI's own configuration reference (hawk 6.6.0, `hawk config show <section> --text`).
app:
  applicationId: ${APP_ID}                      # the StackHawk application "bidswipe"; the workflow finds or creates it
  env: ${APP_ENV:Development}                   # findings compare scan to scan inside one environment
  host: ${APP_HOST:http://localhost:8787}       # in CI the scan guard on port 8788 (scripts/hawkscan-guard.mjs), which
                                                # passes everything on to the app (node dist/server.js, port 8787)
  openApiConf:
    # The scan's copy of docs/api/openapi.yaml (the spec test/openapi.test.ts keeps equal to the server), written by
    # scripts/hawkscan-spec.py after the seed: each kind of path id has its own name there ({jobId}, {personId},
    # {bidRef}) and the examples carry the seed's ids. Without SCAN_SPEC (a local `hawk validate config`) the
    # repository's spec, whose path ids are all "{id}": then the three variables below match nothing.
    filePath: ${SCAN_SPEC:docs/api/openapi.yaml}
    customVariables:                            # real ids from scripts/hawkscan-seed.mjs, so path ids reach the handlers.
      # Keyed by name only. Runs 2 to 4 scoped three "id" entries by `path`; the scoping did not take effect and one
      # value (the person's) went into every {id}, so the job routes were attacked with an id that is not a job.
      - field: jobId                            # /api/jobs/{jobId}/..., /api/admin/jobs/{jobId}/remove: the poster's
        values:                                 # job (the scan user bid on it) and the scan user's own job
          - ${SCAN_JOB_ID:00000000-0000-4000-8000-000000000001}
          - ${SCAN_OWN_JOB_ID:00000000-0000-4000-8000-000000000001}
      - field: personId                         # /api/people/{personId}...: the other TEST account (404 until a job
        values:                                 # between them has closed: the seed cannot get there)
          - ${SCAN_PERSON_ID:00000000-0000-4000-8000-000000000002}
      - field: bidRef                           # /api/bids/{bidRef}, /api/swipe/{bidRef}: one stored bid, saved by
        values:                                 # the scan user
          - ${SCAN_BID_ID:none}
      - field: bidId                            # ?bidId= on market/estimates and bidId in the swipe/estimate bodies
        values:
          - ${SCAN_BID_ID:none}
  # Run 3 (2026-11-16) showed these did NOT keep the scanner away: every route below was still requested (logout 171
  # times); why is not known. What keeps the scan session alive is the scan guard in front of the app
  # (scripts/hawkscan-guard.mjs); the list stays as the statement of what is left out on purpose.
  excludePaths:                                 # regexes, unanchored so they match a path or a whole URL
    - ".*/api/auth/logout.*"                    # would end the scan user's session
    - ".*/api/auth/(login|signup|oauth)$"       # a success replaces the session the request came with (routes/auth.ts answer())
    - ".*/api/stream.*"                         # Server-Sent Events: the response never ends
    - ".*/api/jobs/[^/]+/(cancel|back-out)$"    # would end the scan user's own job / its award; DELETE .../bid stays (POST shares the path)
    - ".*/api/swipe/.+"                         # DELETE only: would undo the scan user's saved bid
  authentication:
    usernamePassword:                           # JSON login, POST /api/auth/login {email, password} (accounts mode)
      type: JSON
      loginPath: /api/auth/login
      usernameField: email
      passwordField: password
      scanUsername: ${SCAN_USERNAME}            # written to GITHUB_ENV by scripts/hawkscan-seed.mjs (an example.com TEST account)
      scanPassword: ${SCAN_PASSWORD}            # random per run, never in the repo or the log
    cookieAuthorization:                        # the login answers Set-Cookie: bs_session=... (HttpOnly, 30 days)
      cookieNames:
        - bs_session
    testPath:                                   # GET /api/me: 401 signed out, 200 signed in (checked against a local server)
      path: /api/me
      type: BODY                                # 200 carries {"account":...}; 401 is {"error":"sign_in_required"}
      success: '.*"account".*'
    sessionVerification:                        # the CLI's own defaults, written out because the scan relies on them:
      pollFrequency: 15                         # re-check the session with testPath every 15 requests while crawling,
      activeScanPollFrequency: 5                # every 5 while attacking, and sign in again when it is gone. In run 3
                                                # the app's log held only ~93 GET /api/me in 48 minutes: the scanner's
                                                # sign-ins were refused (429, its own fuzzing had used up the limit),
                                                # which the guard now prevents. Still few in run 4? Lower both numbers.
hawk:
  failureThreshold: medium                      # exit 42 on a Medium or High finding; the workflow reports it and stays green
  scan:
    maxDurationMinutes: 80                      # the job allows 120 minutes: the scan ends itself first, so its findings are read back
  spider:
    base: true                                  # also crawls the plain links of the shell (/, /privacy.html, /terms.html)
    ajax: true                                  # the app is client-rendered (web/js builds every screen): references/spa-scanning.md
    ajaxBrowser: CHROME_HEADLESS                # Chrome is preinstalled on GitHub's ubuntu-latest runner
    maxDurationMinutes: 5                       # cap for the spiders; the spec drives the API coverage
hawkAddOn:
  replacer:
    rules:
      - matchString: x-bidswipe                 # CSRF guard (src/auth/guard.ts): without it every POST/PUT/DELETE answers 403 csrf
        replacement: "1"                        # replaceOnly false = add the header when missing; no initiators = every request, login included
        replaceOnly: false
tags:                                           # top level: traceability on the StackHawk platform
  - name: _STACKHAWK_AGENT
    value: ${HAWK_AGENT:none}
  - name: _STACKHAWK_GIT_COMMIT_SHA
    value: ${COMMIT_SHA:none}
  - name: _STACKHAWK_GIT_BRANCH
    value: ${BRANCH_NAME:none}
