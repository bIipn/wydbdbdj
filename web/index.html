<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0d12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BidSwipe" />
  <meta name="description" content="Public bids that fit your trade, one swipe at a time." />
  <title>BidSwipe — bids that fit</title>
  <meta name="color-scheme" content="dark" />
  <meta name="application-name" content="BidSwipe" />
  <meta name="msapplication-TileColor" content="#0a0d12" />
  <link rel="manifest" href="manifest.webmanifest" data-demo-strip />
  <link rel="icon" href="icon.svg" type="image/svg+xml" data-demo-strip />
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" data-demo-strip />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" data-demo-strip />
  <link rel="stylesheet" href="styles.css" />
  <!-- Desktop width (Windows / Microsoft Store): media queries only, after styles.css so it wins ties. -->
  <link rel="stylesheet" href="desktop.css" data-demo-strip />
</head>
<body>
  <div class="app" id="app" data-chrome="tabs">
    <header class="topbar">
      <div class="brand">
        <svg class="bolt" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.2 2 4.5 13.4h6.1L9.8 22l8.7-11.5h-6.1z" /></svg>
        <span>BidSwipe</span>
      </div>
      <div class="top-actions">
        <button class="bell" id="bell" type="button" aria-label="Alerts" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" /></svg>
          <span class="bell-count" id="bellCount"></span>
        </button>
        <button class="profile-chip" id="profileChip" type="button" aria-label="Profile">
          <span id="profileName">Loading…</span><span class="dot">·</span><span id="profileBase"></span>
        </button>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" class="tab is-active" data-view="swipe" aria-selected="true">Swipe <span class="count" id="countSwipe"></span></button>
      <button role="tab" class="tab" data-view="browse" aria-selected="false">Browse <span class="count" id="countBrowse"></span></button>
      <button role="tab" class="tab" data-view="saved" aria-selected="false">Saved <span class="count" id="countSaved"></span></button>
      <button role="tab" class="tab" data-view="market" id="marketTab" aria-selected="false" hidden>Market</button>
      <button role="tab" class="tab" data-view="jobs" id="jobsTab" aria-selected="false" hidden>Jobs <span class="count"></span></button>
    </nav>

    <main class="view" id="view" aria-live="polite"></main>
    <p class="footnote" id="footnote"></p>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="js/main.js"></script>
  <!-- The service worker from the first visit (installable app, offline page); push.js reuses the same registration. -->
  <script data-demo-strip>if ('serviceWorker' in navigator && location.protocol !== 'file:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
